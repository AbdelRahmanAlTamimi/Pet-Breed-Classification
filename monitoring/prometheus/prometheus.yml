global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pet-breed-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: pet-breed
    relabel_configs:
      # Show the compose service name instead of host:port in the instance label.
      - source_labels: [__address__]
        regex: "([^:]+):\\d+"
        target_label: instance
        replacement: "$1"
    metric_relabel_configs:
      # Python runtime internals are not used by any panel or alert.
      - source_labels: [__name__]
        regex: "python_gc_.*"
        action: drop

  - job_name: pushgateway
    # Keep the job label pushed by the batch drift check instead of "pushgateway".
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
