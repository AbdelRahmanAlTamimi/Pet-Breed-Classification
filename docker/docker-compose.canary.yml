services:
  model-stable:
    image: ${PETBREED_API_IMAGE:-pet-breed:0.2.0}
    container_name: model-stable
    restart: "no"

  model-canary:
    image: ${PETBREED_API_IMAGE:-pet-breed:0.2.0}
    container_name: model-canary
    restart: "no"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    container_name: pet-breed-nginx
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../serving/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - model-stable
      - model-canary
    restart: "no"
