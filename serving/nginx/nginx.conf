events {}

http {
    upstream pet_breed_backends {
        server model-stable:8000 weight=95;
        server model-canary:8000 weight=5;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://pet_breed_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Serving-Backend $upstream_addr always;
        }
    }
}
